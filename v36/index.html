<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Finanzplaner – Kredite v36 Test</title><style>:root{color-scheme:dark;--b:#08111f;--c:#111827;--t:#f8fafc;--l:#263244;--a:#818cf8;--a2:#a78bfa}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#08111f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{height:100%;display:flex;flex-direction:column}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 8px;background:#08111f}.top a{display:flex;align-items:center;justify-content:center;min-height:42px;border:1px solid var(--l);border-radius:13px;background:var(--c);color:var(--t);text-decoration:none;font-weight:800;font-size:11px}.top a.on{border:0;background:linear-gradient(135deg,var(--a),var(--a2))}.frame{border:0;width:100%;flex:1;background:#08111f}.gear{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111827;border:1px solid #334155;color:white;text-decoration:none;font-size:24px;box-shadow:0 8px 24px #0008;z-index:9}</style></head><body><div class="shell"><nav class="top"><a class="on" href="./">💳 Kredite</a><a href="versicherung.html">🛡️ Versicherung</a><a href="abos.html">🔁 Abos</a></nav><iframe class="frame" id="frame" src="../"></iframe></div><a class="gear" href="einstellungen.html" aria-label="Einstellungen">⚙️</a><script>document.getElementById('frame').onload=function(){try{var d=this.contentDocument,s=d.querySelector('#finanzAppSwitch');if(s)s.style.display='none';var v=d.querySelector('.version');if(v)v.textContent='Finanzplaner · v36 Test'}catch(e){}};</script></body></html>
