function parseNum(v){var x=String(v||'').trim().replace(/\s/g,'');if(x.indexOf(',')>=0)x=x.replace(/\./g,'').replace(',','.');x=Number(x);return isFinite(x)?x:0}function months(a,b){if(!a||!b)return 0;var x=a.split('-'),y=b.split('-');if(x.length!==3||y.length!==3)return 0;var n=(Number(y[0])-Number(x[0]))*12+Number(y[1])-Number(x[1]);return n<0?0:n+1}function loadLoans(){try{var x=JSON.parse(w.localStorage.getItem('kreditplaner_v1')||'{"loans":[]}');return x&&Array.isArray(x.loans)?x:{loans:[]}}catch(e){return{loans:[]}}}function saveLoans(x){w.localStorage.setItem('kreditplaner_v1',JSON.stringify(x))}
