<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Finanzplaner – Testversion</title>
<style>
:root{color-scheme:dark;--b:#08111f;--c:#111827;--t:#f8fafc;--m:#98a2b3;--l:#263244;--a:#818cf8;--a2:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--t)}
.shell{height:100dvh;display:flex;flex-direction:column}
.top{flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#0b1220;border-bottom:1px solid var(--l);box-shadow:0 7px 20px #0005;z-index:5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:680px;margin:0 auto 7px;padding:0 4px}
.brand strong{font-size:14px}.brand span{font-size:10px;color:var(--m)}
.switch{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.switch button{min-height:43px;border:1px solid var(--l);border-radius:14px;background:var(--c);color:var(--t);font-size:13px;font-weight:800}
.switch button.on{border-color:transparent;background:linear-gradient(135deg,var(--a),var(--a2));color:white}
.view{flex:1 1 auto;min-height:0;position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:var(--b)}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><strong>Finanzplaner</strong><span>TESTVERSION</span></div>
    <nav class="switch" aria-label="Bereich wechseln">
      <button id="creditBtn" class="on" type="button">💳 Kredite</button>
      <button id="insuranceBtn" type="button">🛡️ Versicherungen</button>
    </nav>
  </header>
  <main class="view">
    <iframe id="appFrame" title="Finanzplaner Bereich" src="../?v=30"></iframe>
  </main>
</div>
<script>
(function(){
  var frame=document.getElementById('appFrame');
  var credit=document.getElementById('creditBtn');
  var insurance=document.getElementById('insuranceBtn');
  function openArea(area){
    if(area==='insurance'){
      frame.src='versicherung.html?v=2';
      insurance.classList.add('on');
      credit.classList.remove('on');
      try{sessionStorage.setItem('finanzplaner_area','insurance')}catch(e){}
    }else{
      frame.src='../?v=30';
      credit.classList.add('on');
      insurance.classList.remove('on');
      try{sessionStorage.setItem('finanzplaner_area','credit')}catch(e){}
    }
  }
  credit.onclick=function(){openArea('credit')};
  insurance.onclick=function(){openArea('insurance')};
  /* Beim normalen Start bewusst immer Kredite anzeigen. */
  openArea('credit');
})();
</script>
</body>
</html>
