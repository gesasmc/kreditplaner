<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Versicherungen</title><style>:root{color-scheme:dark;--b:#08111f;--c:#111827;--t:#f8fafc;--m:#98a2b3;--l:#263244;--a:#34d399;--a2:#14b8a6;--d:#f97066}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--b),#123047);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 40px}.back{display:inline-block;color:#a7f3d0;text-decoration:none;margin:2px 0 12px;font-weight:800}.hero,.card,.item{background:var(--c);border:1px solid var(--l);border-radius:24px;padding:17px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#059669,#0f766e);border:0}.hero h1{margin:5px 0}.heroGrid,.grid,.row,.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.heroGrid{margin-top:15px}.stat{padding:12px;border-radius:16px;background:#ffffff18}.stat small,.muted{color:#cbd5e1;font-size:12px}.stat strong{display:block;font-size:19px;margin-top:4px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.btn,.tabs button{min-height:45px;border:1px solid var(--l);border-radius:14px;background:var(--c);color:var(--t);font-weight:800}.tabs button.on,.primary{border:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#062b25}.item h3{margin:0}.top{display:flex;justify-content:space-between;gap:10px}.meta{color:var(--m);font-size:12px;line-height:1.55;margin-top:7px}.provider{color:#a7f3d0;font-size:12px;font-weight:800;margin-top:5px}.actions{margin-top:12px}.empty{text-align:center;color:var(--m);padding:28px;border:1px dashed var(--l);border-radius:18px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.on{display:flex}.sheet{width:min(100%,560px);max-height:90vh;overflow:auto;background:var(--c);border-radius:24px;padding:17px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;min-height:47px;border:1px solid var(--l);border-radius:13px;background:var(--b);color:var(--t);padding:9px 11px;font-size:16px}.danger{color:var(--d)}@media(max-width:430px){.row,.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><a class="back" href="index.html">‹ Kredite</a><section class="hero"><small>VERSICHERUNGEN</small><h1>Meine Verträge</h1><div class="heroGrid"><div class="stat"><small>Ø pro Monat</small><strong id="monthly">0 €</strong></div><div class="stat"><small>Nächste Zahlung</small><strong id="next">—</strong></div></div></section><div class="tabs"><button class="tab on" data-filter="all">Alle</button><button class="tab" data-filter="private">Alleine</button><button class="tab" data-filter="shared">Gemeinsam</button></div><div class="actions" style="margin-bottom:12px"><button class="btn primary" id="add">+ Versicherung</button><button class="btn" id="backup">Sicherung</button></div><div id="list"></div><div class="muted" style="margin-top:16px">Testversion · Versicherungen werden separat von den Kreditdaten gespeichert.</div></main><div class="modal" id="modal"><div class="sheet"><h2 id="title">Versicherung</h2><input id="id" type="hidden"><div class="field"><label>Versicherungsschutz</label><input id="name" placeholder="z. B. Kfz-Vollkasko"></div><div class="field"><label>Versicherer / Anbieter</label><input id="provider" placeholder="z. B. HUK-Coburg, Allianz, AXA …"></div><div class="row"><div class="field"><label>Beitrag (€)</label><input id="amount" type="number" step="0.01"></div><div class="field"><label>Zahlungsweise</label><select id="cycle"><option value="1">monatlich</option><option value="3">vierteljährlich</option><option value="6">halbjährlich</option><option value="12">jährlich</option></select></div></div><div class="row"><div class="field"><label>Nächste Zahlung</label><input id="due" type="date"></div><div class="field"><label>Bereich</label><select id="scope"><option value="private">Alleine</option><option value="shared">Gemeinsam</option></select></div></div><details><summary class="muted">Weitere Angaben (optional)</summary><div style="margin-top:10px"><div class="field"><label>Art</label><input id="type" placeholder="Auto, Haftpflicht, Hausrat …"></div><div class="field"><label>Vertragsbeginn</label><input id="start" type="date"></div><div class="field"><label>Policen-/Vertragsnummer</label><input id="policy"></div><div class="field"><label>Notiz</label><input id="note"></div></div></details><div class="actions"><button class="btn" id="cancel">Abbrechen</button><button class="btn primary" id="save">Speichern</button></div><button class="btn danger" id="del" style="display:none;width:100%;margin-top:10px">Versicherung löschen</button></div></div><script>(function(){'use strict';var KEY='finanzplaner_insurance_v1',state=load(),filter='all';function q(s){return document.querySelector(s)}function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function store(){localStorage.setItem(KEY,JSON.stringify(state))}function money(v){var n=Number(v)||0;return Math.max(0,Math.round(n*100)/100)}function eur(v){return money(v).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}function date(s){if(!s)return'—';var p=s.split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:'—'}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function monthly(x){return money(x.amount)/(Number(x.cycle)||1)}function render(){var arr=state.filter(function(x){return filter==='all'||x.scope===filter}),sum=state.reduce(function(s,x){return s+monthly(x)},0),due=state.filter(function(x){return x.due}).sort(function(a,b){return a.due.localeCompare(b.due)})[0];q('#monthly').textContent=eur(sum);q('#next').textContent=due?date(due.due):'—';q('#list').innerHTML=arr.length?arr.map(function(x){var cyc={'1':'monatlich','3':'vierteljährlich','6':'halbjährlich','12':'jährlich'}[String(x.cycle)]||'monatlich',prov=x.provider?'<div class="provider">'+esc(x.provider)+'</div>':'';return '<div class="item" data-id="'+esc(x.id)+'"><div class="top"><div><h3>'+esc(x.name||'Versicherung')+'</h3>'+prov+'<div class="meta">'+esc(x.type||'Versicherung')+' · '+(x.scope==='shared'?'Gemeinsam':'Alleine')+'<br>'+eur(x.amount)+' '+cyc+' · nächste '+date(x.due)+'</div></div><strong>'+eur(monthly(x))+' /Monat</strong></div><button class="btn edit" style="width:100%;margin-top:12px">Bearbeiten</button></div>'}).join(''):'<div class="empty">Noch keine Versicherungen.</div>'}function open(id){var x=null,i;for(i=0;i<state.length;i++)if(state[i].id===id)x=state[i];q('#id').value=x?x.id:'';q('#title').textContent=x?'Versicherung bearbeiten':'Versicherung anlegen';['name','provider','amount','due','type','start','policy','note'].forEach(function(k){q('#'+k).value=x&&x[k]!=null?x[k]:''});q('#cycle').value=x?String(x.cycle||1):'1';q('#scope').value=x?x.scope||'private':'private';q('#del').style.display=x?'block':'none';q('#modal').classList.add('on')}q('#add').onclick=function(){open('')};q('#cancel').onclick=function(){q('#modal').classList.remove('on')};q('#save').onclick=function(){var name=q('#name').value.trim(),amount=money(q('#amount').value),due=q('#due').value;if(!name||!amount||!due){alert('Bitte Versicherungsschutz, Beitrag und nächste Zahlung ausfüllen.');return}var id=q('#id').value,x=null,i;for(i=0;i<state.length;i++)if(state[i].id===id)x=state[i];if(!x){x={id:String(Date.now())};state.push(x)}x.name=name;x.provider=q('#provider').value.trim();x.amount=amount;x.cycle=Number(q('#cycle').value);x.due=due;x.scope=q('#scope').value;x.type=q('#type').value.trim();x.start=q('#start').value;x.policy=q('#policy').value.trim();x.note=q('#note').value.trim();store();q('#modal').classList.remove('on');render()};q('#del').onclick=function(){var id=q('#id').value;if(confirm('Versicherung wirklich löschen?')){state=state.filter(function(x){return x.id!==id});store();q('#modal').classList.remove('on');render()}};q('#list').onclick=function(e){var b=e.target.closest('.edit');if(!b)return;open(b.closest('.item').getAttribute('data-id'))};document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');filter=b.getAttribute('data-filter');render()}});q('#backup').onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='versicherungen.json';a.click()};render()})();</script></body></html>
