g wie eure gemeinsamen Kredite.</div></main><div class="modal" id="modal"><div class="sheet"><h2 id="title">Versicherung</h2><input id="id" type="hidden"><input id="origin" type="hidden"><div class="field"><label>Versicherungsschutz</label><input id="name" placeholder="z. B. Kfz-Vollkasko"></div><div class="field"><label>Versicherer / Anbieter</label><input id="provider" placeholder="z. B. HUK-Coburg, Allianz, AXA …"></div><div class="row"><div class="field"><label>Beitrag (€)</label><input id="amount" type="number" step="0.01"></div><div class="field"><label>Zahlungsweise</label><select id="cycle"><option value="1">monatlich</option><option value="3">vierteljährlich</option><option value="6">halbjährlich</option><option value="12">jährlich</option></select></div></div><div class="row"><div class="field"><label>Nächste Zahlung</label><input id="due" type="date"></div><div class="field"><label>Bereich</label><select id="scope"><option value="private">Alleine</option><option value="shared">Gemeinsam</option></select></div></div><details><summary class="muted">Weitere Angaben (optional)</summary><div style="margin-top:10px"><div class="field"><label>Art</label><input id="type" placeholder="Auto, Haftpflicht, Hausrat …"></div><div class="field"><label>Vertragsbeginn</label><input id="start" type="date"></div><div class="field"><label>Policen-/Vertragsnummer</label><input id="policy"></div><div class="field"><label>Notiz</label><input id="note"></div></div></details><div class="actions"><button class="btn" id="cancel">Abbrechen</button><button class="btn primary" id="save">Speichern</button></div><button class="btn danger" id="del" style="display:none;width:100%;margin-top:10px">Versicherung löschen</button></div></div><script>(function(){'use strict';var KEY='finanzplaner_insurance_v1',SHARED_KEY='kreditplaner_shared_code',ENDPOINT='https://ymjngslafotilihvvbbl.supabase.co/functions/v1/couple-sync',APIKEY='sb_publishable_dLzM2hTl77RvOIEdc78hRA_5xJAF02r',state=load(),shared=[],filter='all',loading=false;function q(s){return document.querySelector(s)}function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function store(){localStorage.setItem(KEY,JSON.stringify(state))}function money(v){var n=Number(v)||0;return Math.max(0,Math.round(n*100)/100)}function eur(v){return money(v).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}function date(s){if(!s)return'—';var p=s.split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:'—'}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function monthly(x){return money(x.amount)/(Number(x.cycle)||1)}function code(){return localStorage.getItem(SHARED_KEY)||''}function api(action,data,cb){var c=code();if(!c)return cb(new Error('Keine gemeinsame Verbindung vorhanden.'));var xhr=new XMLHttpRequest(),body={action:action,code:c},k;data=data||{};for(k in data)body[k]=data[k];xhr.open('POST',ENDPOINT,true);xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('apikey',APIKEY);xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;var j={};try{j=JSON.parse(xhr.responseText||'{}')}catch(e){}if(xhr.status<200||xhr.status>=300)return cb(new Error(j.error||'Verbindung fehlgeschlagen'));cb(null,j)};xhr.send(JSON.stringify(body))}function normalizeShared(x){return{id:x.id,name:x.name||'',provider:x.provider||'',amount:Number(x.amount||0),cycle:Number(x.cycle||1),due:x.due||'',scope:'shared',type:x.insurance_type||'',start:x.start_date||'',policy:x.policy||'',note:x.note||'',_shared:true}}function loadShared(){if(!code()){shared=[];q('#syncInfo').textContent='Gemeinsam: noch keine Verbindung. Verbindet euch einmal im Kredit-Bereich – diese Verbindung gilt dann automatisch auch hier.';render();return}loading=true;q('#syncInfo').textContent='Gemeinsame Versicherungen werden synchronisiert …';api('list_insurances',{},function(err,j){loading=false;if(err){q('#syncInfo').textContent='Gemeinsame Versicherungen konnten gerade nicht geladen werden.';shared=[];render();return}shared=(j.insurances||[]).map(normalizeShared);q('#syncInfo').textContent='Gemeinsam verbunden · Änderungen sind auf beiden Geräten sichtbar.';render()})}function combined(){var a=state.slice(),i;for(i=0;i<shared.length;i++)a.push(shared[i]);return a}function render(){var all=combined(),arr=all.filter(function(x){return filter==='all'||x.scope===filter}),sum=all.reduce(function(s,x){return s+monthly(x)},0),due=all.filter(function(x){return x.due}).sort(function(a,b){return a.due.localeCompare(b.due)})[0];q('#monthly').textContent=eur(sum);q('#next').textContent=due?date(due.due):'—';if(filter==='shared'&&!code()){q('#list').innerHTML='<div class="empty">Keine zweite Freischaltung nötig.<br><br>Einmal im Kredit-Bereich verbinden – danach erscheinen gemeinsame Versicherungen hier automatisch auf beiden Geräten.</div>';return}q('#list').innerHTML=arr.length?arr.map(function(x){var cyc={'1':'monatlich','3':'vierteljährlich','6':'halbjährlich','12':'jährlich'}[String(x.cycle)]||'monatlich',prov=x.provider?'<div class="provider">'+esc(x.provider)+'</div>':'',badge=x.scope==='shared'?'<span class="sharedBadge">↻ Gemeinsam synchronisiert</span>':'';return '<div class="item" data-id="'+esc(x.id)+'" data-kind="'+(x._shared?'shared':'private')+'"><div class="top"><div><h3>'+esc(x.name||'Versicherung')+'</h3>'+prov+'<div class="meta">'+esc(x.type||'Versicherung')+' · '+(x.scope==='shared'?'Gemeinsam':'Alleine')+'<br>'+eur(x.amount)+' '+cyc+' · nächste '+date(x.due)+'</div>'+badge+'</div><strong>'+eur(monthly(x))+' /Monat</strong></div><button class="btn edit" style="width:100%;margin-top:12px">Bearbeiten</button></div>'}).join(''):'<div class="empty">Noch keine Versicherungen.</div>'}function findItem(id,kind){var a=kind==='shared'?shared:state,i;for(i=0;i<a.length;i++)if(String(a[i].id)===String(id))return a[i];return null}function open(id,kind){var x=id?findItem(id,kind):null;q('#id').value=x?x.id:'';q('#origin').value=x?(x._shared?'shared':'private'):'';q('#title').textContent=x?'Versicherung bearbeiten':'Versicherung anlegen';['name','provider','amount','due','type','start','policy','note'].forEach(function(k){q('#'+k).value=x&&x[k]!=null?x[k]:''});q('#cycle').value=x?String(x.cycle||1):'1';q('#scope').value=x?x.scope||'private':'private';q('#del').style.display=x?'block':'none';q('#modal').classList.add('on')}function payload(){return{name:q('#name').value.trim(),provider:q('#provider').value.trim(),amount:money(q('#amount').value),cycle:Number(q('#cycle').value),due:q('#due').value,insurance_type:q('#type').value.trim(),start_date:q('#start').value||null,policy:q('#policy').value.trim(),note:q('#note').value.trim()}}function savePrivate(id,p){var x=id?findItem(id,'private'):null;if(!x){x={id:String(Date.now())};state.push(x)}x.name=p.name;x.provider=p.provider;x.amount=p.amount;x.cycle=p.cycle;x.due=p.due;x.scope='private';x.type=p.insurance_type;x.start=p.start_date||'';x.policy=p.policy;x.note=p.note;store()}function deletePrivate(id){state=state.filter(function(x){return String(x.id)!==String(id)});store()}function close(){q('#modal').classList.remove('on')}q('#add').onclick=function(){open('','private')};q('#cancel').onclick=close;q('#save').onclick=function(){var p=payload(),id=q('#id').value,origin=q('#origin').value,target=q('#scope').value;if(!p.name||!p.amount||!p.due){alert('Bitte Versicherungsschutz, Beitrag und nächste Zahlung ausfüllen.');return}if(target==='shared'&&!code()){alert('Bitte zuerst einmal im Kredit-Bereich die gemeinsame Verbindung einrichten. Danach gilt sie automatisch auch für Versicherungen.');return}if(origin==='shared'&&target==='shared'){api('update_insurance',{insurance_id:id,name:p.name,provider:p.provider,amount:p.amount,cycle:p.cycle,due:p.due,insurance_type:p.insurance_type,start_date:p.start_date,policy:p.policy,note:p.note},function(err){if(err)return alert(err.message);close();loadShared()});return}if(origin==='private'&&target==='private'){savePrivate(id,p);close();render();return}if(!origin&&target==='private'){savePrivate('',p);close();render();return}if(!origin&&target==='shared'){api('create_insurance',p,function(err){if(err)return alert(err.message);close();loadShared()});return}if(origin==='private'&&target==='shared'){api('create_insurance',p,function(err){if(err)return alert(err.message);deletePrivate(id);close();loadShared()});return}if(origin==='shared'&&target==='private'){savePrivate('',p);api('delete_insurance',{insurance_id:id},function(err){if(err)return alert(err.message);close();loadShared()});return}};q('#del').onclick=function(){var id=q('#id').value,origin=q('#origin').value;if(!confirm('Versicherung wirklich löschen?'))return;if(origin==='shared'){api('delete_insurance',{insurance_id:id},function(err){if(err)return alert(err.message);close();loadShared()})}else{deletePrivate(id);close();render()}};q('#list').onclick=function(e){var b=e.target.closest('.edit');if(!b)return;var card=b.closest('.item');open(card.getAttribute('data-id'),card.getAttribute('data-kind'))};document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');filter=b.getAttribute('data-filter');render()}});q('#backup').onclick=function(){var data={private_insurances:state,shared_insurances:shared,exported_at:new Date().toISOString()},blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='versicherungen.json';a.click()};render();loadShared()})();</script></body></html>
